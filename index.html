<!DOCTYPE html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Han Jeongjun</title>
    <script src="main.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </head>

  <body>
    <div id="myapp"></div>

    <script>
      var elemMyApp = document.getElementById('myapp')
      var app = Elm.Main.init({
        node: elemMyApp
      });

      document.addEventListener('DOMContentLoaded', () => {
        var btnDownloadPDF = document.getElementById('downloadPDF')
        btnDownloadPDF.addEventListener('click', (e) => {
          html2pdf(elemMyApp)
        })
      })
    </script>
  </body>
</html>
